<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is it Product Life Cycle?</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans flex items-center justify-center min-h-screen">

    <div id="quiz-container" class="max-w-md w-full p-8 bg-slate-800 rounded-2xl shadow-2xl">
        
        <div id="welcome-screen" class="text-center">
            <h1 class="text-3xl font-bold mb-2 text-cyan-400">PLC Quiz</h1>
            <p class="text-slate-400 mb-6">Determine the stage of your product.</p>
            
            <input type="text" id="user-name" placeholder="Enter your name" 
                class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 mb-4 focus:outline-none focus:ring-2 focus:ring-cyan-500 text-white">
            
            <button onclick="startQuiz()" 
                class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                Enter Quiz
            </button>
        </div>

        <div id="quiz-area" class="hidden">
            <h2 class="text-sm uppercase tracking-widest text-slate-500 mb-2" id="user-display"></h2>
            <p class="text-lg mb-6" id="question">Loading question...</p>
            <div id="options" class="space-y-3">
                <button onclick="handleAnswer('Yes')" class="w-full text-left p-3 rounded bg-slate-700 hover:bg-slate-600 transition">Yes</button>
                <button onclick="handleAnswer('No')" class="w-full text-left p-3 rounded bg-slate-700 hover:bg-slate-600 transition mt-2">No</button>
            </div>
        </div>
    </div>

    <script>
// 1. Data storage & Quiz Setup
let userData = { 
    name: "", 
    startTime: "", 
    score: 0, 
    answers: [],
    secret: "MY_QUIZ_2026" 
};

const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtgoreHCHdvsSVtYdQH_n7KCr4GY50UAnQCLV0KN3BhmVm6c3KLhgEY5EYCUKaErztbg/exec";

// 2. Your New Questions
const questions = [
    { 
        q: "What colour is the Sun?", 
        options: ["Red", "Green", "Yellow", "Blue"], 
        correct: "Yellow" 
    },
    { 
        q: "Do you know what product life cycle is?", 
        options: ["Yes", "No"], 
        correct: "Yes" 
    },
    { 
        q: "How many legs does a dog have?", 
        options: ["1", "2", "3", "4"], 
        correct: "4" 
    }
];

let currentQuestionIndex = 0;

// 3. Navigation Logic
function startQuiz() {
    const nameInput = document.getElementById('user-name').value;
    if (nameInput.trim() === "") return alert("Please enter a name!");

    userData.name = nameInput;
    userData.startTime = new Date().toLocaleString();

    document.getElementById('welcome-screen').classList.add('hidden');
    document.getElementById('quiz-area').classList.remove('hidden');
    document.getElementById('user-display').innerText = `Vibing as: ${userData.name}`;
    
    loadQuestion();
}

function loadQuestion() {
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    
    // Clear old buttons
    optionsEl.innerHTML = "";

    if (currentQuestionIndex < questions.length) {
        const currentQ = questions[currentQuestionIndex];
        questionEl.innerText = currentQ.q;

        // Create buttons for each option
        currentQ.options.forEach(option => {
            const btn = document.createElement('button');
            btn.innerText = option;
            btn.className = "w-full text-left p-3 rounded bg-slate-700 hover:bg-slate-600 transition border border-slate-600";
            btn.onclick = () => handleAnswer(option);
            optionsEl.appendChild(btn);
        });
    } else {
        showResults();
    }
}

function handleAnswer(selectedOption) {
    const currentQ = questions[currentQuestionIndex];

    // Check if correct and add point
    if (selectedOption === currentQ.correct) {
        userData.score += 1;
    }

    // Record answer for the database
    userData.answers.push({
        question: currentQ.q,
        selected: selectedOption,
        wasCorrect: selectedOption === currentQ.correct
    });
    
    currentQuestionIndex++;
    loadQuestion();
}

// 4. Submission Logic
async function showResults() {
    document.getElementById('quiz-area').innerHTML = `
        <div class="text-center">
            <h2 class="text-2xl font-bold mb-2">Quiz Complete!</h2>
            <p class="text-cyan-400 text-xl font-bold mb-4">Your Score: ${userData.score} / ${questions.length}</p>
            <p class="mb-6 text-slate-400 italic">Sending your data to the cloud...</p>
            <div class="animate-spin h-8 w-8 border-4 border-cyan-500 border-t-transparent rounded-full mx-auto"></div>
        </div>
    `;

    await submitResults();
    
    document.getElementById('quiz-area').innerHTML = `
        <div class="text-center">
            <h2 class="text-2xl font-bold mb-2 text-green-400">Data Logged!</h2>
            <p class="mb-4">Final Score: ${userData.score} / ${questions.length}</p>
            <button onclick="location.reload()" class="bg-slate-700 px-4 py-2 rounded text-sm">Restart</button>
        </div>
    `;
}

async function submitResults() {
    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(userData)
        });
    } catch (e) { console.error(e); }
}
    </script>
</body>
</html>
