<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is it Product Life Cycle?</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans flex items-center justify-center min-h-screen">

    <div id="quiz-container" class="max-w-md w-full p-8 bg-slate-800 rounded-2xl shadow-2xl">
        <h1 class="text-2xl font-bold mb-4 text-cyan-400">PLC Quiz Builder</h1>
        <div id="question-area">
            <p class="text-lg mb-6" id="question">Loading your first vibe...</p>
            <div id="options" class="space-y-3">
                </div>
        </div>
    </div>

    <script>
        // This is where your 'Vibe' logic lives
        const questions = [
            { q: "Are your profit margins currently peaking?", stage: "Maturity" },
            { q: "Is your main goal currently just 'surviving' and building awareness?", stage: "Introduction" }
        ];

        function loadQuestion() {
            const q = questions[0];
            document.getElementById('question').innerText = q.q;
            // More logic goes here as you build!
        }
        
        loadQuestion();
    </script>
</body>
</html>
