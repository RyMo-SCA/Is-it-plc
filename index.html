<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is it Product Life Cycle?</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans flex items-center justify-center min-h-screen">

    <div id="quiz-container" class="max-w-md w-full p-8 bg-slate-800 rounded-2xl shadow-2xl">
        
        <div id="welcome-screen" class="text-center">
            <h1 class="text-3xl font-bold mb-2 text-cyan-400">PLC Quiz</h1>
            <p class="text-slate-400 mb-6">Determine the stage of your product.</p>
            
            <input type="text" id="user-name" placeholder="Enter your name" 
                class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 mb-4 focus:outline-none focus:ring-2 focus:ring-cyan-500 text-white">
            
            <button onclick="startQuiz()" 
                class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                Enter Quiz
            </button>
        </div>

        <div id="quiz-area" class="hidden">
            <h2 class="text-sm uppercase tracking-widest text-slate-500 mb-2" id="user-display"></h2>
            <p class="text-lg mb-6" id="question">Loading question...</p>
            <div id="options" class="space-y-3">
                <button onclick="handleAnswer('Yes')" class="w-full text-left p-3 rounded bg-slate-700 hover:bg-slate-600 transition">Yes</button>
                <button onclick="handleAnswer('No')" class="w-full text-left p-3 rounded bg-slate-700 hover:bg-slate-600 transition mt-2">No</button>
            </div>
        </div>
    </div>

    <script>
let userData = { 
    name: "", 
    startTime: "", 
    score: 0, 
    // New Categorized Tracking
    categoryScores: {
        "Concept": { correct: 0, total: 0 },
        "Design": { correct: 0, total: 0 },
        "Prototyping": { correct: 0, total: 0 },
        "Production": { correct: 0, total: 0 },
        "Support": { correct: 0, total: 0 },
        "Planning": { correct: 0, total: 0 }
    }
};

const questions = [
    { q: "Sequence of the five stages?", stage: "Concept", correct: "Concept + NPI, Design + Development, Prototype + Test, Launch + Production, Maintain + Support", options: [...] },
    { q: "Goal of Concept + NPI?", stage: "Concept", correct: "To generate and refine a product idea that fulfills a market need.", options: [...] },
    { q: "Focus of Design + Development?", stage: "Design", correct: "Engineering the features of the product to ensure its feasibility and functionality.", options: [...] },
    { q: "Methodology for ease of assembly (DFMA)?", stage: "Design", correct: "DFMA", options: [...] },
    { q: "What defines Prototype + Test?", stage: "Prototyping", correct: "Building a model of the product to validate its design and functionality.", options: [...] },
    { q: "Methodology for Root Cause (5 Whys)?", stage: "Prototyping", correct: "The 5 Whys", options: [...] },
    { q: "Objective of Launch + Production?", stage: "Production", correct: "To manufacture the product at scale while maintaining quality and efficiency.", options: [...] },
    { q: "Visualize journey (Value Stream Mapping)?", stage: "Production", correct: "Value Stream Mapping", options: [...] },
    { q: "Function of Maintain + Support?", stage: "Support", correct: "Ensuring customer satisfaction by tracking issues and updates.", options: [...] },
    { q: "Visual map for critical path (PERT)?", stage: "Planning", correct: "PERT Chart", options: [...] }
];

// ... (startQuiz and loadQuestion remain the same)

function handleAnswer(selectedOption) {
    const currentQ = questions[currentQuestionIndex];
    const isCorrect = selectedOption === currentQ.correct;
    
    // Update Global Score
    if (isCorrect) userData.score += 1;

    // Update Categorized Score
    const stage = currentQ.stage;
    userData.categoryScores[stage].total += 1;
    if (isCorrect) {
        userData.categoryScores[stage].correct += 1;
    }
    
    currentQuestionIndex++;
    loadQuestion();
}

async function showResults() {
    // Generate Feedback HTML based on categories
    let feedbackHTML = `<h3 class="text-cyan-400 font-bold mb-4">Stage Breakdown:</h3>`;
    
    for (const [stage, data] of Object.entries(userData.categoryScores)) {
        const percent = data.total > 0 ? Math.round((data.correct / data.total) * 100) : 0;
        const color = percent >= 100 ? 'text-green-400' : percent >= 50 ? 'text-yellow-400' : 'text-red-400';
        
        feedbackHTML += `
            <div class="flex justify-between text-sm mb-1 border-b border-slate-700 pb-1">
                <span>${stage}:</span>
                <span class="${color}">${percent}%</span>
            </div>`;
    }

    document.getElementById('quiz-area').innerHTML = `
        <div class="text-center">
            <h2 class="text-2xl font-bold mb-2">Results for ${userData.name}</h2>
            <div class="bg-slate-900 p-4 rounded-lg mb-6 text-left">
                ${feedbackHTML}
            </div>
            <button onclick="location.reload()" class="bg-cyan-600 px-6 py-2 rounded-lg font-bold">Try Again</button>
        </div>
    `;

    await submitResults();
}
    </script>
</body>
</html>
